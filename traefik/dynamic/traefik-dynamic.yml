# Traefik dynamic config (file provider)
# Security headers middleware – attach to routers via labels if needed
# Note: Traefik forwards X-Forwarded-For by default when proxying; API uses it for login IP / user location in admin
# SEO: redirect www to canonical domain (301). Replace your-domain.com with your actual domain in regex/replacement and in routers.
http:
  middlewares:
    security-headers:
      headers:
        # X-XSS-Protection (browserXssFilter) is deprecated; CSP does the real work.
        browserXssFilter: false
        contentTypeNosniff: true
        forceSTSHeader: true
        # 2 years + preload — eligible for hstspreload.org submission (manual).
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 63072000
        # frameDeny is overridden by customFrameOptionsValue below.
        frameDeny: false
        customFrameOptionsValue: "SAMEORIGIN"
        # Tighten referrer leak: send origin cross-site, never full URL.
        referrerPolicy: "strict-origin-when-cross-origin"
        customResponseHeaders:
          # See dockerProd/traefik/dynamic/traefik-dynamic.yml for the full
          # rationale — the same comments apply here verbatim.
          Permissions-Policy: "camera=(self), microphone=(self), display-capture=(self), geolocation=(self), payment=(), usb=(), bluetooth=(), serial=(), hid=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), idle-detection=(), screen-wake-lock=(self)"
          Cross-Origin-Opener-Policy: "same-origin"
          Cross-Origin-Resource-Policy: "same-site"
        # CSP design — strict but not user-hostile. Full per-directive rationale
        # lives in dockerProd/traefik/dynamic/traefik-dynamic.yml; the same
        # caveats apply here. Key items:
        # - script-src + script-src-elem both carry the JSON-LD sha256 hash;
        #   regenerate when editing the inline schema in Src/frontend/index.html.
        # - script-src-attr 'unsafe-inline' — required by some 3rd-party widgets
        #   (GTM Custom HTML / react-bootstrap / Plyr / LiveKit) that emit inline
        #   onclick attributes; verified breakage on /feed/home when set to 'none'.
        #   See dockerProd/traefik/dynamic/traefik-dynamic.yml for full notes.
        # - frame-src omits 'self' — frame-ancestors already covers it.
        # - img-src / media-src include `https:` (intentional UX trade-off).
        # - upgrade-insecure-requests auto-promotes user-pasted http:// links.
        contentSecurityPolicy: >-
          default-src 'self';
          base-uri 'self';
          form-action 'self';
          frame-ancestors 'self';
          object-src 'none';
          script-src 'self' https://challenges.cloudflare.com https://static.cloudflareinsights.com https://www.googletagmanager.com 'sha256-QiE76tkPgSRcnqaJbaFxIGa+JmVG0gmw+ifJn5emBsA=';
          script-src-elem 'self' https://challenges.cloudflare.com https://static.cloudflareinsights.com https://www.googletagmanager.com 'sha256-QiE76tkPgSRcnqaJbaFxIGa+JmVG0gmw+ifJn5emBsA=';
          script-src-attr 'unsafe-inline';
          style-src 'self' 'unsafe-inline';
          font-src 'self' data:;
          img-src 'self' data: blob: https:;
          connect-src 'self' https://cloudflareinsights.com https://www.google-analytics.com https://region1.google-analytics.com https://api.your-domain.com https://admin.your-domain.com https://docs.your-domain.com wss://your-domain.com wss://api.your-domain.com wss://bellamy-book-dmhbvg4h.livekit.cloud;
          frame-src https://challenges.cloudflare.com https://www.youtube-nocookie.com https://player.vimeo.com https://www.tiktok.com https://platform.twitter.com https://open.spotify.com https://player.twitch.tv https://clips.twitch.tv https://w.soundcloud.com;
          worker-src 'self' blob:;
          manifest-src 'self';
          media-src 'self' blob: https:;
          upgrade-insecure-requests
    # WebSocket support for SignalR (Traefik auto-detects Upgrade: websocket header)
    # No special config needed - Traefik handles WebSocket upgrades automatically
    # This middleware can be attached if needed for additional headers
    websocket-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"
          X-Forwarded-Port: "443"
    # Redirect www to canonical (one domain for SEO). Replace your-domain.com with your domain.
    redirect-www-to-canonical:
      redirectRegex:
        regex: "^https?://www\\.your-domain\\.com/(.*)"
        replacement: "https://your-domain.com/${1}"
        permanent: true
  routers:
    # HTTP redirect
    frontend-www-redirect:
      rule: "Host(`www.your-domain.com`)"
      entryPoints:
        - web
      middlewares:
        - redirect-www-to-canonical
      service: "noop@internal"

    # HTTPS redirect
    frontend-www-redirect-secure:
      rule: "Host(`www.your-domain.com`)"
      entryPoints:
        - websecure
      middlewares:
        - redirect-www-to-canonical
      service: "noop@internal"
      tls: true